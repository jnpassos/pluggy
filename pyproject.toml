[project]
name = "pluggy-fetcher"
version = "0.1.0"
description = "Pluggy Open Finance API Data Fetcher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "BLE", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"